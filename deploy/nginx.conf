server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # $uri alone, without the $uri/ directory form. Without an asset on disk the
    # $uri/ form matches a directory, and nginx answers 403 rather than falling
    # through to index.html — which reads as "the server is refusing this file"
    # when it actually just means the asset is missing from the image.
    location / {
        try_files $uri /index.html;
    }
}
